<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <!-- Meta SEO -->
  {% if page.excerpt %}
    <meta name="description" content="{{ page.excerpt | truncate:160 | strip_html }}">
  {% else %}
    <meta name="description" content="Tiago Padrela Amaro personal website. Geek and coder.">
  {% endif %}

  {% seo %}

  <!-- Google Site Verification -->
  <meta name="google-site-verification" content="R0IzQeYRkG8i9_d7_jq546RZ589H33qJwAs8X_EH23M" />

  <!-- CSS -->
  <!-- Orders the `legacy` cascade layer between Tailwind's `base` (Preflight)
       and `components`/`utilities`: legacy still loses to Tailwind utility
       classes regardless of selector specificity, but still beats Preflight's
       resets for pages not yet migrated to Tailwind. -->
  <style type="text/css">@layer theme, base, legacy, components, utilities;</style>
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Berkshire+Swash"/>
  <link rel="stylesheet" type="text/css" href="/public/css/tailwind.css"/>
  <link rel="stylesheet" type="text/css" href="/public/js/emfed/toots.css"/>

  <!-- Thank you so much to Garth Braithwaite (http://garthdb.com/writings/i-am-a-jekyll-god/) -->
  <style type="text/css">
    {% capture include_to_scssify %}
      {% include style.scss %}
    {% endcapture %}
    @layer legacy {
      {{ include_to_scssify | scssify }}
    }
  </style>

  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/public/favicons/touch-icon-144-precomposed.png">
  <link rel="shortcut icon" href="/public/favicons/favicon.png">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/atom.xml">
</head>
